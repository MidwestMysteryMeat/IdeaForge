<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>IdeaForge — Inspiration Slot Machine</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0b0e14; --bg2:#10141d; --panel:#141926; --panel2:#1a2030;
  --ink:#e6eaf2; --ink-dim:#8b94a7; --line:#232b3d;
  --accent:#f5b356; --accent-ink:#1a1206;
  --r-common:#aeb7c4; --r-uncommon:#4ade80; --r-rare:#38bdf8;
  --r-epic:#c084fc; --r-legendary:#fbbf24; --r-mythic:#f43f5e;
}
[data-theme="ice"]{--accent:#67e8f9;--accent-ink:#062026}
[data-theme="toxic"]{--accent:#a3e635;--accent-ink:#141c04}
[data-theme="ember"]{--accent:#ff6b35;--accent-ink:#210b02}
[data-theme="royal"]{--accent:#a78bfa;--accent-ink:#130b2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #182036 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#flash{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;background:radial-gradient(circle at 50% 45%, #fff7e0 0%, rgba(255,215,120,.55) 40%, transparent 75%)}
#flash.on{animation:flash .6s ease-out}
#flash.mythic{background:radial-gradient(circle at 50% 45%, #ffd7dd 0%, rgba(244,63,94,.5) 40%, transparent 75%)}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#stage{max-width:900px;margin:0 auto;padding:20px 16px 60px;position:relative}
#stage.shake{animation:shake .5s linear}
#stage.shake-big{animation:shakeBig .75s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(4px,4px)}}
@keyframes shakeBig{0%,100%{transform:translate(0,0)}15%{transform:translate(-10px,6px) rotate(-.4deg)}30%{transform:translate(11px,-7px) rotate(.4deg)}45%{transform:translate(-9px,-6px)}60%{transform:translate(9px,7px) rotate(-.3deg)}75%{transform:translate(-6px,4px)}90%{transform:translate(4px,-3px)}}
@media (prefers-reduced-motion:reduce){#stage.shake,#stage.shake-big{animation:none}}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:6px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-weight:900;font-size:22px;letter-spacing:3px}
.brand span{color:var(--accent)}
.brand small{display:block;font-weight:500;letter-spacing:1px;font-size:10px;color:var(--ink-dim);text-transform:uppercase}
.rank{flex:1 1 220px;min-width:200px;max-width:360px}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
#rankTitle{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
#xpText{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.xpbar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#fff3);border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.2,1)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn:active{transform:scale(.95)}
.chip-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#streak{font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
#streak.fire{border-color:#f97316;color:#fdba74;background:#2a160a}
#streak.fire.hi{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---------- pull button ---------- */
.pull-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 24px}
#pull{
  width:min(440px,100%);padding:22px 20px 18px;border:0;border-radius:18px;cursor:pointer;
  font:900 26px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:4px;color:var(--accent-ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 100%,white 12%),var(--accent));
  box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,black 45%),0 14px 40px -8px color-mix(in srgb,var(--accent) 50%,transparent);
  transition:transform .07s,box-shadow .07s,filter .15s;
}
#pull small{display:block;font-weight:600;font-size:11px;letter-spacing:2px;margin-top:7px;opacity:.65}
#pull:hover{filter:brightness(1.06)}
#pull:active,#pull.pressed{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,black 45%),0 6px 18px -6px color-mix(in srgb,var(--accent) 50%,transparent)}

/* ---------- banner ---------- */
#banner{
  position:relative;text-align:center;font-weight:900;letter-spacing:3px;font-size:14px;color:#0e1420;
  background:linear-gradient(90deg,transparent,var(--r-legendary),transparent);
  border-radius:8px;padding:6px;margin:0 auto 12px;max-width:420px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;
}
#banner.show{opacity:1;transform:translateY(0)}

/* ---------- result card ---------- */
#card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:5px solid var(--r-common);
  border-radius:16px;padding:22px 24px;position:relative;overflow:hidden;
}
#card.pop{animation:pop .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.965)}100%{opacity:1;transform:none}}
#card.mythic-anim{animation:mythicIn 1s cubic-bezier(.2,1,.3,1)}
@keyframes mythicIn{0%{opacity:0;transform:scale(1.15);filter:invert(1) blur(4px)}45%{opacity:1;filter:invert(1) blur(0)}60%{filter:invert(0)}100%{transform:scale(1)}}
#card.empty{color:var(--ink-dim);text-align:center;padding:48px 24px;font-size:15px;border-left-color:var(--line)}
#card .glowbar{position:absolute;inset:0 auto 0 0;width:5px}
.rar-tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:6px;border:1px solid currentColor;margin-bottom:10px}
#ideaTitle{font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.15;margin-bottom:4px}
.meta{color:var(--ink-dim);font-size:13px;margin-bottom:14px}
.meta b{color:var(--ink);font-weight:600}
.hook{font-size:16.5px;font-style:italic;border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 16px;color:#cdd6e6}
.sect{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
#feats{list-style:none}
#feats li{padding:4px 0 4px 22px;position:relative}
#feats li::before{content:"▸";position:absolute;left:4px;color:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13.5px}
.kv div{color:var(--ink-dim)}
.kv b{color:var(--ink);font-weight:600}
.twist{background:#0d1119;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
#favBtn.faved{background:#2a2410;border-color:var(--r-legendary);color:var(--r-legendary)}

/* rarity skins */
#card.r-common{border-left-color:var(--r-common)} #card.r-common .rar-tag{color:var(--r-common)}
#card.r-uncommon{border-left-color:var(--r-uncommon)} #card.r-uncommon .rar-tag{color:var(--r-uncommon)}
#card.r-rare{border-left-color:var(--r-rare);box-shadow:0 0 40px -18px var(--r-rare)} #card.r-rare .rar-tag{color:var(--r-rare)}
#card.r-epic{border-left-color:var(--r-epic);box-shadow:0 0 46px -16px var(--r-epic)} #card.r-epic .rar-tag{color:var(--r-epic)}
#card.r-legendary{border-left-color:var(--r-legendary);box-shadow:0 0 60px -12px var(--r-legendary)} #card.r-legendary .rar-tag{color:var(--r-legendary);background:#241a05}
#card.r-mythic{border-left-color:var(--r-mythic);box-shadow:0 0 70px -10px var(--r-mythic);background:linear-gradient(180deg,#1d1016,#141926)} #card.r-mythic .rar-tag{color:var(--r-mythic);background:#26060d}

/* ---------- lower panels ---------- */
.row2{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:22px}
@media (max-width:760px){.row2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
#history{display:flex;flex-direction:column;gap:6px}
.hist-chip{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.hist-chip:hover{border-color:var(--accent)}
.hist-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.hist-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-chip em{margin-left:auto;color:var(--ink-dim);font-size:11px;font-style:normal;flex:0 0 auto}
#chList{display:flex;flex-direction:column;gap:10px}
.ch{font-size:13px}
.ch .bar{height:5px;background:var(--bg2);border-radius:99px;margin-top:5px;overflow:hidden}
.ch .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.ch.done{color:var(--ink-dim)}
.ch.done .txt::after{content:" ✓";color:var(--r-uncommon);font-weight:900}
.ch .sub{color:var(--ink-dim);font-size:11px;margin-top:2px}

/* ---------- codex modal ---------- */
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,8,14,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal.hidden,#banner.hidden{display:none}
.hidden{display:none}
.modal-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;padding:22px 24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal-head h2{font-size:18px;letter-spacing:2px}
#codexStats{color:var(--ink-dim);font-size:13px;margin-bottom:14px}
.cdx-group{margin-bottom:14px}
.cdx-group h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.cdx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.cdx-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cdx-item:hover{border-color:var(--accent)}
.cdx-item.fav::after{content:" ★";color:var(--r-legendary)}
.modal-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.theme-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.theme-dot.sel{border-color:#fff}
.theme-dot.locked{opacity:.3;cursor:not-allowed}
footer{margin-top:26px;text-align:center;color:var(--ink-dim);font-size:12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;z-index:80;transition:all .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-theme="forge">
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="stage">
  <header>
    <div class="brand">IDEA<span>FORGE</span><small>inspiration slot machine</small></div>
    <div class="rank">
      <div class="rank-top"><span id="rankTitle">Novice</span><span id="xpText">0 XP</span></div>
      <div class="xpbar"><div id="xpFill"></div></div>
    </div>
    <div class="hud">
      <div class="chip-btn" id="streak" title="Streak — pull again within 45s to keep it">🔥 ×0</div>
      <button class="chip-btn" id="hardBtn" title="Surprise Me Harder — much better odds of Rare+ and weirder combos">🌶 Harder</button>
      <button class="chip-btn" id="soundBtn" title="Toggle sound">🔊</button>
      <button class="chip-btn" id="codexBtn" title="Your discovered ideas">📚 Codex</button>
    </div>
  </header>

  <div class="pull-wrap">
    <button id="pull">PULL IDEA<small>SPACE / ENTER</small></button>
  </div>

  <div id="banner" class="hidden">✦ NEW DISCOVERY! ✦</div>

  <article id="card" class="empty">The forge is lit. Pull the lever and see what the void hands you.</article>

  <div class="row2">
    <section class="panel"><h3>Recent pulls</h3><div id="history"></div></section>
    <section class="panel"><h3>Today's challenges</h3><div id="chList"></div></section>
  </div>

  <footer>Everything is generated and stored locally. Nothing leaves this page.</footer>
</div>

<div id="codex" class="modal hidden">
  <div class="modal-panel">
    <div class="modal-head"><h2>📚 CODEX</h2><button class="chip-btn" id="codexClose">✕ Close</button></div>
    <div id="codexStats"></div>
    <div id="codexBody"></div>
    <div class="modal-foot">
      <span style="font-size:12px;color:var(--ink-dim)">Theme:</span>
      <span id="themeRow"></span>
      <span style="flex:1"></span>
      <button class="chip-btn" id="resetBtn" title="Resets streak and today's challenge progress. Codex, rank and favorites are kept.">Reset session stats</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   IdeaForge — data tables
   ===================================================================== */

const RARITIES = [
  {k:"common",    name:"Common",    color:"#aeb7c4", w:42,  hw:13, xp:10,  tier:0},
  {k:"uncommon",  name:"Uncommon",  color:"#4ade80", w:27,  hw:19, xp:25,  tier:0},
  {k:"rare",      name:"Rare",      color:"#38bdf8", w:16,  hw:25, xp:60,  tier:1},
  {k:"epic",      name:"Epic",      color:"#c084fc", w:9,   hw:21, xp:150, tier:1},
  {k:"legendary", name:"Legendary", color:"#fbbf24", w:5,   hw:15, xp:400, tier:2},
  {k:"mythic",    name:"Mythic",    color:"#f43f5e", w:1,   hw:7,  xp:1000,tier:2},
];

const SETTINGS = [
  "a drowned megacity","a generation ship at half power","a haunted Appalachian holler",
  "a bureaucratic afterlife","a mushroom-forest kingdom","the first spring after a new ice age",
  "a 1980s strip mall that never closes","an orbital junkyard","the inside of a dying god",
  "a desert of rusted machines","a floating archipelago","a Soviet-era research town",
  "a neon smuggling port","a medieval city under plague quarantine","a deep-sea drilling colony",
  "a cardboard diorama world","a lighthouse at the edge of the map","an endless commuter train"
];

const ROLES = [
  "a debt collector","the last cartographer","a defrocked priest","a union rep","a junior necromancer",
  "a salvage captain","the royal food taster","a night-shift radio operator","the gravekeeper","an apprentice archivist"
];

const GENRES = [
 {n:"RPG", nouns:["Oath","Crown","Pilgrim","Bloodline","Reliquary","Vow"], hooks:[
   "You are {role} in {setting}, and every promise you make becomes a binding quest — break one and the world collects.",
   "Your character sheet is a lie you told the guild; leveling up means keeping the story straight in {setting}.",
   "Raise a doomed hero in {setting}: you play the mentor, and the stats you grind belong to someone who will leave you."
 ], mech:[
   "Promises function as quest contracts with enforced penalties",
   "Per-faction reputation that never resets — the world keeps receipts",
   "Dialogue skill checks spend the same resource pool as combat",
   "Companions remember and reference your single worst decision",
   "Gear degrades into heirlooms that accumulate story tags",
   "No XP from kills — only from deeds that someone witnessed",
   "Respec exists, but it is an in-world ritual with a real cost"
 ]},
 {n:"Roguelike", nouns:["Descent","Spiral","Catacomb","Gauntlet","Depths","Wake"], hooks:[
   "Every death in {setting} leaves a corpse the next run must deal with — loot it, bury it, or fight what it became.",
   "The dungeon is honest, but your map was drawn by a previous run's unreliable narrator.",
   "You descend {setting} with one spell that mutates every floor — mastery means predicting your own toolkit."
 ], mech:[
   "Corpse persistence: your last three deaths physically exist in the world",
   "Seeded daily runs with a shared leaderboard of one number",
   "A single ability that mutates per floor along a visible rule",
   "Meta-progression is knowledge only — zero stat carryover",
   "Enemies statistically learn your favorite tactic across runs",
   "Shops barter in run time: pay in seconds off the clock"
 ]},
 {n:"Metroidvania", nouns:["Labyrinth","Vessel","Atlas","Chrysalis","Rift","Hollowing"], hooks:[
   "The map of {setting} physically folds — new abilities don't open doors, they refold the world.",
   "You're the cartographer, not the hero: chart {setting} ahead of an NPC knight who dies wherever your map is wrong.",
   "Every upgrade is a parasite with an opinion; the more mobility you gain, the less of you is left."
 ], mech:[
   "World-folding traversal instead of lock-and-key gating",
   "Progress gated by knowledge the player carries, not items",
   "Sequence breaks are canon, detected, and change dialogue",
   "One seamless interconnected map; fast travel is the final reward",
   "Bosses become re-fightable movement puzzles after victory",
   "An upgrade-refusal path that is fully supported"
 ]},
 {n:"Puzzle", nouns:["Cipher","Lattice","Knot","Prism","Axiom","Tessera"], hooks:[
   "Each level is a tiny machine in {setting}; solving it permanently changes the rules for every level after.",
   "Undo is the mechanic — you can only move backward through causes, never forward through effects.",
   "Two overlaid grids, one truth: what you toggle in the light rearranges the dark."
 ], mech:[
   "Rule mutations persist across the whole campaign",
   "Undo-as-verb: rewinding costs a resource enemies also use",
   "The level editor is secretly the final level",
   "Hints exist but each one costs a piece of the story",
   "About 8 rule words that combine into 60 hand-authored levels",
   "A daily puzzle assembled from rules you have already learned"
 ]},
 {n:"Strategy", nouns:["Dominion","Banner","Bastion","Accord","Frontier","Regicide"], hooks:[
   "A strategy game about losing well: victory is scored by what your civilization leaves behind in {setting}.",
   "Command armies across {setting} through orders that take days to arrive — you are always planning for a battlefield that no longer exists.",
   "Every unit is a named citizen with a day job; conscripting your blacksmith wins the battle and breaks your economy."
 ], mech:[
   "Order latency: commands arrive late and sometimes garbled",
   "Legacy scoring — ruins, roads, and grudges outlive you",
   "Named-citizen units drafted straight out of your economy",
   "No fog of war; instead, fog of intent on enemy orders",
   "Seasons rewrite the map graph (rivers freeze, passes close)",
   "Diplomacy through hostage exchange and witnessed oaths"
 ]},
 {n:"Simulation", nouns:["District","Menagerie","Terrarium","Commons","Foundry","Parish"], hooks:[
   "Simulate {setting} one household at a time — the city emerges from ten thousand small refusals.",
   "A sandbox where physics, chemistry, and rumor are all the same propagation system.",
   "You control no one in {setting}; you only control the infrastructure, and behavior follows the pipes."
 ], mech:[
   "Agents with needs plus a gossip layer that distorts information",
   "Infrastructure-only interaction: you build, they decide",
   "Fully inspectable causality — click anything, see exactly why",
   "Save states are shareable scenario files others can remix",
   "A real economy that emerges from only three base resources",
   "Time controls down to per-agent slow motion"
 ]},
 {n:"Platformer", nouns:["Leap","Comet","Sprocket","Tumble","Zephyr","Ricochet"], hooks:[
   "Your jump arc is drawn before you leap — commit to the line, then survive it.",
   "Momentum is currency in {setting}: spend speed to open doors, and going slow is going broke.",
   "You are the level: rearrange your own body's platforms while a tiny climber ascends you."
 ], mech:[
   "Draw-then-execute jump arcs with mid-air edit charges",
   "Speed-as-currency gates that literally buy your momentum",
   "A ghost of your best line races you in every room",
   "A strict 3-color readability rule: hazard, safe, gold",
   "Coyote time and input buffering exposed in a tuning menu",
   "Rooms remember your death spots and taunt you gently"
 ]},
 {n:"Shooter", nouns:["Salvo","Caliber","Muzzle","Tracer","Breach","Payload"], hooks:[
   "Every bullet you fire in {setting} still exists — rounds ricochet forever, and old shots are the real enemy.",
   "One gun that reloads by catching what you killed with it.",
   "Cover degrades honestly: the arena's destruction is your real ammo counter."
 ], mech:[
   "Persistent projectiles that never despawn within a level",
   "Catch-your-shot reload loop that rewards positioning",
   "Destructible cover as a spendable, shared economy",
   "No hitscan anywhere — everything can be dodged on reaction",
   "Enemies telegraph through sound a half-second before sight",
   "A pacifist route scored on shots not fired"
 ]},
 {n:"Visual Novel", nouns:["Testimony","Letters","Solstice","Verdict","Reverie","Confession"], hooks:[
   "The text itself is the crime scene — re-reading a chapter changes what was written.",
   "Romance the suspects of a murder in {setting}; affection and alibi share one meter.",
   "You read the same week from four heads; the truth lives in the contradictions, not the routes."
 ], mech:[
   "Mutable text: passages rewrite themselves when re-read",
   "A single meter that is both affection and alibi",
   "A contradiction journal that fills itself — sometimes wrongly",
   "No flags: a fuzzy relationship model instead of switches",
   "One true ending assembled from pieces of the false ones",
   "Fully voiced with two narrators who disagree"
 ]},
 {n:"Idle / Incremental", nouns:["Dividend","Perpetua","Accretion","Surplus","Compound","Quota"], hooks:[
   "An incremental where the numbers get smaller: shrink {setting} down to the last prime and see what's underneath.",
   "Your factory keeps running while you're gone — but so does its labor movement.",
   "Played by writing rules, not clicking: automate everything, then automate the automation."
 ], mech:[
   "Descending numbers — progress is division, not inflation",

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
function weighted(pairs){
  let total = 0; for (const p of pairs) total += p[1];
  let r = Math.random()*total;
  for (const p of pairs){ r -= p[1]; if (r < 0) return p[0]; }
  return pairs[pairs.length-1][0];
}
function sample(arr, n){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0, Math.min(n, a.length));
}
const fill = s => s.replace(/\{setting\}/g, () => rnd(SETTINGS)).replace(/\{role\}/g, () => rnd(ROLES));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }

const KEY = "ideaforge_v1";
const freshStats = () => ({pullsToday:0, rarePlusToday:0, bestStreakToday:0, legendToday:0, discToday:0, favToday:0});
let S;
function loadState(){
  try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
  if (!S || S.v !== 1){
    S = {v:1, xp:0, pulls:0, streak:0, bestStreak:0, lastPullAt:0,
         codex:[], favs:[], seen:{}, unlocked:["forge"], theme:"forge",
         sound:true, hard:false, day:"", daily:[], done:{}, stats:freshStats(), nextId:1};
  }
  const today = new Date().toISOString().slice(0,10);
  if (S.day !== today){
    S.day = today;
    S.stats = freshStats();
    S.done = {};
    S.daily = sample(CHALLENGES.map(c=>c.id), 3);
  }
  if (!S.unlocked.includes(S.theme)) S.theme = "forge";
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* =====================================================================
   idea generation
   ===================================================================== */

function rollRarity(){
  return weighted(RARITIES.map(r => [r, S.hard ? r.hw : r.w]));
}

function gameTitle(gA, gB, mythic){
  const noun = rnd(gA.nouns.concat(gB ? gB.nouns : []));
  const comp = rnd(T_PRE)+rnd(T_SUF);
  if (mythic) return comp.toUpperCase();
  const pat = Math.floor(Math.random()*5);
  if (pat===0) return rnd(T_ADJ)+" "+noun;
  if (pat===1) return "The "+rnd(T_ADJ)+" "+noun;
  if (pat===2) return comp;
  if (pat===3) return noun+": "+rnd(T_SUB);
  return comp+" "+rnd(T_SUB);
}
function softTitle(cat, mythic){
  const name = rnd(S_PRE)+rnd(S_SUF);
  if (mythic) return name.toUpperCase();
  if (cat==="Tool / Utility") return name;
  if (cat==="Creative Software" && Math.random()<0.4) return cap(rnd(S_PRE))+" "+rnd(["Studio","Lab","Deck","Bench"]);
  return cap(name);
}

function featureCount(r){ return r.tier===0 ? 3 : r.tier===1 ? 4 : 5; }

function pickScope(r){
  const w = [30,34,25,11];
  w[2]+=r.tier*5; w[3]+=r.tier*7;
  return weighted(SCOPES.map((s,i)=>[s,w[i]]));
}

function buildGame(r){
  const A = rnd(GENRES);
  let B = null;
  const fuse = r.tier===2 || (r.k==="epic" && Math.random()<0.4);
  if (fuse){ do { B = rnd(GENRES); } while (B===A); }
  const hook = fill(rnd(A.hooks));
  let mech;
  if (B){
    const nA = Math.ceil(featureCount(r)/2);
    mech = sample(A.mech, nA).concat(sample(B.mech, featureCount(r)-nA));
  } else {
    mech = sample(A.mech, featureCount(r));
  }
  const twists = [rnd(TWISTS.game[r.tier])];
  if (r.k==="mythic"){
    let t2; do { t2 = rnd(TWISTS.game[2]); } while (t2===twists[0]);
    twists.push(t2);
  }
  const plat = (r.tier===2 && Math.random()<0.45) ? rnd(WILD_PLAT) : rnd(GAME_PLAT);
  return {
    cat:"Game", type: B ? A.n+" × "+B.n : A.n,
    title: gameTitle(A, B, r.k==="mythic"),
    hook, feats: mech, twists, plat, scope: pickScope(r)
  };
}

function buildSoft(cat, r){
  const data = SOFT[cat];
  const A = rnd(data.types);
  let hook = fill(rnd(A.hooks));
  let type = A.n;
  if (cat==="Engine / Middleware" && r.tier===2){
    let B; do { B = rnd(data.types); } while (B===A);
    type = A.n.replace(" Engine","")+"-"+B.n.replace(" Engine","")+" Engine";
    hook = hook.replace(/\.$/,"") + ". " + B.fuse;
  }
  const n = featureCount(r);
  const own = sample(A.f, Math.min(A.f.length, n-1));
  const pool = data.feats.filter(f => !own.includes(f));
  const feats = own.concat(sample(pool, n - own.length));
  const twists = [rnd(TWISTS.soft[r.tier])];
  if (r.k==="mythic"){
    let t2; do { t2 = rnd(TWISTS.soft[2]); } while (t2===twists[0]);
    twists.push(t2);
  }
  const plat = (r.tier===2 && Math.random()<0.35) ? rnd(WILD_PLAT) : rnd(data.plat);
  return { cat, type, title: softTitle(cat, r.k==="mythic"), hook, feats, twists, plat, scope: pickScope(r) };
}

function generateIdea(){
  const r = rollRarity();
  const cat = weighted(CATS);
  const body = cat==="Game" ? buildGame(r) : buildSoft(cat, r);
  const idea = Object.assign({ id:S.nextId++, rar:r.k, ts:Date.now() }, body);
  idea.sig = hash([idea.cat, idea.type, idea.hook, idea.twists.join("|")].join("~"));
  return idea;
}

/* =====================================================================
   effects: audio, particles, shake, flash

let AC = null;
function tone(f, d, t, type, g){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state==="suspended") AC.resume();
    const o = AC.createOscillator(), ga = AC.createGain();
    o.type = type||"square"; o.frequency.value = f;
    const t0 = AC.currentTime + (t||0);
    ga.gain.setValueAtTime(g||0.045, t0);
    ga.gain.exponentialRampToValueAtTime(0.0001, t0 + (d||0.12));
    o.connect(ga); ga.connect(AC.destination);
    o.start(t0); o.stop(t0 + (d||0.12) + 0.03);
  } catch(e){}
}
function raritySound(k){
  if (k==="common") tone(330,0.09);
  else if (k==="uncommon") tone(392,0.08), tone(494,0.1,0.07);
  else if (k==="rare") tone(523,0.09), tone(659,0.12,0.08);
  else if (k==="epic") tone(523,0.08), tone(659,0.08,0.07), tone(784,0.16,0.14);
  else if (k==="legendary"){ tone(659,0.1,0,"triangle",0.06); tone(880,0.1,0.1,"triangle",0.06); tone(1175,0.3,0.2,"triangle",0.06); }
  else { tone(220,0.25,0,"sawtooth",0.05); tone(165,0.3,0.15,"sawtooth",0.05); tone(110,0.6,0.3,"sawtooth",0.06); tone(1760,0.4,0.55,"sine",0.03); }
}

const fx = $("fx"), fctx = fx.getContext("2d");
let parts = [], fxRunning = false;
function fxResize(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", fxResize); fxResize();
function burst(x, y, color, n, opt){
  opt = opt||{};
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (opt.slow?1.5:2.5)+Math.random()*(opt.slow?3:6);
    let px=x, py=y, vx=Math.cos(a)*sp, vy=Math.sin(a)*sp-2;
    if (opt.implode){ const rr = 120+Math.random()*160; px = x+Math.cos(a)*rr; py = y+Math.sin(a)*rr; vx = (x-px)/22; vy = (y-py)/22; }
    parts.push({x:px,y:py,vx,vy,g:opt.implode?0:0.12,life:1,decay:0.012+Math.random()*0.02,
                r:2+Math.random()*3,c:color});
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay;
    fctx.globalAlpha = Math.max(p.life,0);
    fctx.fillStyle = p.c;
    fctx.fillRect(p.x, p.y, p.r, p.r);
  }
  fctx.globalAlpha = 1;
  if (parts.length){ requestAnimationFrame(fxTick); } else { fxRunning = false; fctx.clearRect(0,0,fx.width,fx.height); }
}
function cardCenter(){
  const b = $("card").getBoundingClientRect();
  return [b.left + b.width/2, Math.min(b.top + 120, b.top + b.height/2)];
}
function shake(big){
  const st = $("stage");
  st.classList.remove("shake","shake-big"); void st.offsetWidth;
  st.classList.add(big ? "shake-big" : "shake");
}
function flash(mythic){
  const f = $("flash");
  f.classList.toggle("mythic", !!mythic);
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
}
function rarityFx(idea){
  const r = RARITIES.find(x=>x.k===idea.rar);
  raritySound(r.k);
  if (r.tier===0) return;
  const [cx, cy] = cardCenter();
  if (r.k==="rare") burst(cx, cy, r.color, 30);
  else if (r.k==="epic") burst(cx, cy, r.color, 55);
  else if (r.k==="legendary"){ burst(cx, cy, r.color, 90); burst(cx, cy, "#fff7e0", 30); flash(false); shake(false); }
  else { burst(cx, cy, r.color, 60, {implode:true}); setTimeout(()=>burst(cx, cy, r.color, 110), 350); setTimeout(()=>burst(cx, cy, "#1b0208", 40),380); flash(true); shake(true); }
}

/* =====================================================================
   progression + challenges
   ===================================================================== */

function levelInfo(xp){
  let li = 0;
  for (let i=0;i<LEVELS.length;i++) if (xp >= LEVELS[i].xp) li = i;
  const cur = LEVELS[li], next = LEVELS[li+1] || null;
  const pct = next ? Math.min(100, 100*(xp-cur.xp)/(next.xp-cur.xp)) : 100;
  return {li, cur, next, pct};
}
function grantXp(n){
  const before = levelInfo(S.xp).li;
  S.xp += Math.round(n);
  const after = levelInfo(S.xp).li;
  if (after > before){
    toast("⬆ RANK UP — "+LEVELS[after].t+"!");
    tone(523,0.1,0,"triangle",0.06); tone(784,0.1,0.12,"triangle",0.06); tone(1046,0.3,0.24,"triangle",0.06);
    const [cx,cy]=cardCenter(); burst(cx, cy-60, getComputedStyle(document.body).getPropertyValue("--accent").trim()||"#f5b356", 50);
  }
  renderRank();
}
function streakMult(){ return 1 + 0.1*Math.min(Math.max(S.streak-1,0), 10); }

function tickChallenges(){
  for (const id of S.daily){
    const c = CHALLENGES.find(x=>x.id===id);
    if (!c || S.done[id]) continue;
    if ((S.stats[c.stat]||0) >= c.target){
      S.done[id] = true;
      grantXp(c.reward);
      if (c.unlock && !S.unlocked.includes(c.unlock)){
        S.unlocked.push(c.unlock);
        toast("🏆 Challenge complete — theme unlocked: "+c.unlock+"! (+"+c.reward+" XP)");
      } else {
        toast("🏆 Challenge complete! +"+c.reward+" XP");
      }
    }
  }
  renderChallenges();
}

function renderChallenges(){

function renderCodex(){
  const total = S.codex.length;
  $("codexStats").textContent = total+" discovered · "+S.pulls+" total pulls · best streak ×"+S.bestStreak+" · "+S.favs.length+" favorites";

/* ---------- toast / clipboard / formats ---------- */

let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
function copyText(text, msg){
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("Copy failed — select manually"); }
  document.body.removeChild(ta);
}
function formatText(i){
  const r = RARITIES.find(x=>x.k===i.rar);
  return ["★ "+r.name.toUpperCase()+" IDEA — IdeaForge","",
    "Title: "+i.title, "Category: "+i.cat, "Type: "+i.type, "",
    "Hook: "+i.hook, "", "Key features:", ...i.feats.map(f=>"  - "+f), "",
    (i.twists.length>1?"Twists:":"Twist:")+" "+i.twists.join(" / "),
    "Platform: "+i.plat, "Scope: "+i.scope.n+" — "+i.scope.d].join("\n");
}
function formatMd(i){
  const r = RARITIES.find(x=>x.k===i.rar);
  return ["## "+i.title, "", "**"+r.name+" · "+i.cat+" · "+i.type+"**", "",
    "> "+i.hook, "", "**Key features**", ...i.feats.map(f=>"- "+f), "",
    "**"+(i.twists.length>1?"Twists":"Twist")+":** "+i.twists.join(" · "), "",
    "**Platform:** "+i.plat+"  ", "**Scope:** "+i.scope.n+" — "+i.scope.d].join("\n");
}

/* ---------- favorites / codex maintenance ---------- */

function toggleFav(idea){
  const ix = S.favs.indexOf(idea.sig);
  if (ix >= 0) S.favs.splice(ix,1);
  else { S.favs.push(idea.sig); S.stats.favToday++; tickChallenges(); }
  save();
  renderCard(idea, false);
}
function addToCodex(idea){
  const isNew = !S.seen[idea.sig];
  if (isNew){
    S.seen[idea.sig] = true;
    S.codex.push(idea);
    S.stats.discToday++;
    if (S.codex.length > 400){
      const cut = S.codex.findIndex(i=>!S.favs.includes(i.sig));
      if (cut >= 0){ delete S.seen[S.codex[cut].sig]; S.codex.splice(cut,1); }
    }
  }
  return isNew;
}

/* =====================================================================
   the pull
   ===================================================================== */

function pull(){
  const now = Date.now();
  S.streak = (now - S.lastPullAt <= 45000) ? S.streak+1 : 1;
  S.lastPullAt = now;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.stats.bestStreakToday = Math.max(S.stats.bestStreakToday, S.streak);

  const idea = generateIdea();
  current = idea;
  S.pulls++;
  S.stats.pullsToday++;
  const r = RARITIES.find(x=>x.k===idea.rar);
  if (r.tier >= 1) S.stats.rarePlusToday++;
  if (r.tier === 2) S.stats.legendToday++;

  const isNew = addToCodex(idea);
  history.unshift(idea);
  if (history.length > 10) history.pop();

  renderCard(idea, true);
  renderHistory();
  renderStreak();
  rarityFx(idea);

  const banner = $("banner");
  banner.classList.toggle("hidden", !isNew);
  if (isNew){ banner.classList.remove("show"); void banner.offsetWidth; banner.classList.add("show"); }

  grantXp(r.xp * streakMult());
  tickChallenges();
  save();
}

    save();
  });
  $("soundBtn").addEventListener("click", () => {
    S.sound = !S.sound;
    $("soundBtn").textContent = S.sound ? "🔊" : "🔇";
    if (S.sound) tone(659,0.08);
    save();
  });

    if (!$("codex").classList.contains("hidden")) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.key === "Enter" && tag === "BUTTON" && document.activeElement.id !== "pull") return;
    e.preventDefault();
    const p = $("pull");
    p.classList.add("pressed");
    setTimeout(()=>p.classList.remove("pressed"), 110);
    pull();
  });
  save();
}
init();
</script>
</body>
</html>
